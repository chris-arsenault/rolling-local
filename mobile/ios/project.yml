name: RollingLocal
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RollingLocal:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ahara.rollinglocal.operator
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Rolling Local
        UILaunchScreen: {}
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Share your truck's approximate location while you choose to broadcast.
        NSCameraUsageDescription: Take a photo of your truck's current menu.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rollinglocal]
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [group.io.ahara.rollinglocal.operator]
    dependencies:
      - target: StatusWidget
  StatusWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.ahara.rollinglocal.operator.widget
    info:
      path: Generated/Widget-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Generated/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.ahara.rollinglocal.operator]
schemes:
  RollingLocal:
    build:
      targets:
        RollingLocal: all
