name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  android:
    name: Build Android operator and widget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build and lint Android
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

  ios:
    name: Build iOS operator and widget
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project RollingLocal.xcodeproj -scheme RollingLocal \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build

  ci:
    needs: [android, ios]
    uses: chris-arsenault/ahara/.github/workflows/ci.yml@main
    with:
      rust_extra_ci_commands: cargo test --locked --manifest-path backend/Cargo.toml --bins --tests
    secrets: inherit

  smoke:
    name: Check deployed routes and API
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check site and public API
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.rolling-local.ahara.io"
          site="https://rolling-local.ahara.io"
          curl_opts=(--fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 25)
          curl "${curl_opts[@]}" "$api/health" | jq -e '.status == "ok"'
          curl "${curl_opts[@]}" "$api/public/menu-catalog" | jq -e '
            .tagVocabularyVersion == 1 and (.menus | type == "array") and (.tags | length > 0)'
          curl "${curl_opts[@]}" "$api/public/trucks" | jq -e '
            (.trucks | type == "array") and
            all(.trucks[]; (.active and has("location")) or ((.active | not) and (has("location") | not)))'
          shell="$(curl "${curl_opts[@]}" "$site/")"
          grep -F 'property="og:title" content="Find food trucks"' <<< "$shell"
          grep -F "property=\"og:image\" content=\"$site/rolling-local-share.png\"" <<< "$shell"
          entry="$(grep -oE '/assets/index-[a-zA-Z0-9_-]+\.js' <<< "$shell")"
          curl "${curl_opts[@]}" "$site/config.js" | grep -F "$api"
          for image in rolling-local-share.png favicon-16x16.png favicon-32x32.png apple-touch-icon.png pwa-192x192.png pwa-512x512.png; do
            curl "${curl_opts[@]}" --head "$site/$image" | grep -iF 'content-type: image/png'
          done
          curl "${curl_opts[@]}" --head "$site/favicon.svg" | grep -iF 'content-type: image/svg+xml'
          curl "${curl_opts[@]}" --head "$site/favicon.ico" | grep -iF 'content-type: image/x-icon'
          curl "${curl_opts[@]}" "$site/manifest.webmanifest" | jq -e '.name == "Rolling Local" and .start_url == "/"'
          for path in about register admin; do
            route_shell="$(curl "${curl_opts[@]}" "$site/$path")"
            case "$path" in
              about) title='Rolling Local for truck operators' ;;
              register) title='Register your truck' ;;
              admin) title='Truck administration' ;;
            esac
            grep -F "property=\"og:title\" content=\"$title\"" <<< "$route_shell"
            grep -F "property=\"og:url\" content=\"$site/$path\"" <<< "$route_shell"
            grep -F "$entry" <<< "$route_shell"
          done
          curl "${curl_opts[@]}" "$api/public/config" | jq -e --arg audience "$api" '
            .issuer == "https://auth.ahara.io/" and .audience == $audience and
            all((.connection, .webClientId, .iosClientId, .androidClientId); type == "string" and length > 0)'
          curl "${curl_opts[@]}" --dump-header - --output /dev/null --request OPTIONS \
            --header "Origin: $site" --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization, content-type' \
            "$api/operator/registration" | grep -iF "access-control-allow-origin: $site"
          for path in operator admin/trucks; do
            code="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$api/$path")"
            case "$code" in
              401|403) ;;
              *) printf 'Anonymous /%s returned %s\n' "$path" "$code" >&2; exit 1 ;;
            esac
          done
